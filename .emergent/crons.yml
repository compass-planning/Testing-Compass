crons:
  - name: task-digest
    description: "Hourly check that emails advisors their task digest at each advisor's chosen hour (ET)"
    cron: "0 * * * *"
    timezone: "America/Toronto"
    endpoint: "{{BASE_URL}}/api/cron/task-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
