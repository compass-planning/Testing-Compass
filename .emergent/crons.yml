crons:
  - name: task-digest
    description: "Hourly check that emails advisors their daily task digest at each advisor's chosen hour (ET)"
    cron: "0 * * * *"
    timezone: "America/Toronto"
    endpoint: "{{BASE_URL}}/api/cron/task-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: book-digest
    description: "Weekly (Mondays) book-health summary emailed at each advisor's chosen hour (ET)"
    cron: "0 * * * 1"
    timezone: "America/Toronto"
    endpoint: "{{BASE_URL}}/api/cron/book-digest"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: today-summary
    description: "Hourly check that emails advisors an opt-in end-of-day recap at each advisor's chosen hour (ET)"
    cron: "0 * * * *"
    timezone: "America/Toronto"
    endpoint: "{{BASE_URL}}/api/cron/today-summary"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: invite-reminders
    description: "Daily nudge emailing portal invites still pending over 7 days; re-nudges weekly until accepted"
    cron: "0 13 * * *"
    endpoint: "{{BASE_URL}}/api/cron/invite-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
  - name: renewal-reminders
    description: "Daily scan of insurance policies renewing within 60 days; creates a de-duplicated advisor task per policy"
    cron: "0 12 * * *"
    timezone: "America/Toronto"
    endpoint: "{{BASE_URL}}/api/cron/renewal-reminders"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
